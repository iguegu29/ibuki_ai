<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="description" content="누구의 폰일까?">
<title>伊吹 藍</title>
<style>
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP","Noto Sans KR",sans-serif;
  --blue:#007aff;--gray:#8e8e93;--sep:rgba(60,60,67,.22);--red:#ff3b30;--green:#34c759;--bg2:#f2f2f7;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 30%,#2b2e38,#0d0e12);font-family:var(--font)}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#scaler{transform-origin:center center;flex:none}
.device{position:relative;width:399px;height:836px}
.sbtn{position:absolute;width:6px;z-index:5;background:linear-gradient(90deg,#8a8e99,#484b54 60%,#2d2f36);border-radius:3px;box-shadow:0 0 0 .5px #1a1b1f,inset 0 1px 0 rgba(255,255,255,.25)}
.sbtn[data-btn=power]{background:linear-gradient(270deg,#8a8e99,#484b54 60%,#2d2f36)}
.phone{position:absolute;inset:0;background:#000;border-radius:56px;border:12px solid #0b0b0d;
  box-shadow:0 0 0 2px #5b5e68,0 0 0 4px #1a1b1f,0 40px 90px rgba(0,0,0,.65);overflow:hidden}
.inner{position:absolute;inset:0;border-radius:44px;overflow:hidden;background:#000;font-family:var(--font);color:#000}

/* ---- notch / status / home bar ---- */
.notch{position:absolute;top:0;left:50%;width:209px;height:30px;margin-left:-104.5px;background:#000;border-radius:0 0 22px 22px;z-index:310;pointer-events:none}
.notch::before,.notch::after{content:"";position:absolute;top:0;width:12px;height:12px}
.notch::before{left:-12px;background:radial-gradient(circle at 0 100%,transparent 12px,#000 12.5px)}
.notch::after{right:-12px;background:radial-gradient(circle at 100% 100%,transparent 12px,#000 12.5px)}
.notch .spk{position:absolute;top:9px;left:78px;width:52px;height:6px;border-radius:3px;background:#1b1b1e}
.notch .cam{position:absolute;top:8px;left:140px;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#2c3150,#0c0d14)}
.status{position:absolute;top:0;left:0;right:0;height:44px;z-index:300;color:#fff;font-weight:600;font-size:15px;pointer-events:none;transition:color .25s}
.phone[data-sb=dark] .status{color:#000}
.status .l,.status .r{position:absolute;top:0;height:44px;display:flex;align-items:center;justify-content:center;gap:5px;padding-top:3px}
.status .l{left:0;right:calc(50% + 104.5px);letter-spacing:.2px}
.status .r{left:calc(50% + 104.5px);right:0;padding-right:6px;gap:4px}
.batt{width:25px;height:12px;border:1px solid currentColor;border-radius:3.5px;position:relative;padding:1.5px;opacity:.95}
.batt::before{content:"";position:absolute;right:-3.2px;top:3.5px;width:1.6px;height:4px;border-radius:0 1px 1px 0;background:currentColor;opacity:.5}
.batt i{display:block;height:100%;width:4%;min-width:2.5px;background:#ff3b30;border-radius:1.5px}
.bp{font-size:11.5px;font-weight:600;letter-spacing:0}
.status .r svg:nth-of-type(1){width:15px}.status .r svg:nth-of-type(2){width:14px}
@media (max-width:400px){
  .status .r{gap:3px;padding-right:8px;justify-content:flex-end}
  .status .r svg:nth-of-type(1){width:15px}.status .r svg:nth-of-type(2){width:14px}
  .status .l{padding-left:6px;font-size:14px}
  .batt{width:22px;height:11px}
  .bp{display:none}
}
.homebar{position:absolute;bottom:8px;left:50%;margin-left:-67px;width:134px;height:5px;border-radius:3px;background:#fff;z-index:320;pointer-events:none;transition:background .25s}
.phone[data-sb=dark] .homebar{background:#000}
.hbhit{position:absolute;left:0;right:0;bottom:0;height:24px;z-index:319;cursor:pointer}

/* ---- lock ---- */
#home{position:absolute;inset:0;z-index:1}
#apps{position:absolute;inset:0;z-index:10;pointer-events:none}
#apps>*{pointer-events:auto}
#lock{position:absolute;inset:0;z-index:20;color:#fff;text-align:center;touch-action:none;cursor:pointer;transition:transform .45s cubic-bezier(.3,.7,.2,1),opacity .45s}
#lock.up{transform:translateY(-100%);opacity:.6}
.lk-icon{margin-top:52px;height:18px;display:flex;justify-content:center}
.lk-time{margin-top:8px;font-size:78px;font-weight:200;letter-spacing:-1px;line-height:1}
.lk-date{margin-top:4px;font-size:20px;font-weight:500}
.lnotifs{position:absolute;top:208px;left:8px;right:8px;display:flex;flex-direction:column;gap:8px;text-align:left}
.ln{background:rgba(255,255,255,.72);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:14px;padding:10px 12px 11px;color:#000}
.ln .h{display:flex;align-items:center;gap:7px;font-size:12px;color:rgba(0,0,0,.55);text-transform:none;letter-spacing:.3px;margin-bottom:4px}
.ln .h span:last-child{margin-left:auto}
.ln b{display:block;font-size:15px;font-weight:600}
.ln.ttin{opacity:0;transform:translateY(14px);transition:opacity .35s,transform .4s cubic-bezier(.2,.9,.3,1)}
.ln.ttin.on{opacity:1;transform:none}
.ln div.t{font-size:15px;line-height:1.3}
.lk-btn{position:absolute;bottom:50px;width:50px;height:50px;border-radius:50%;background:rgba(30,30,32,.5);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:center}
.lk-hint{position:absolute;bottom:22px;left:0;right:0;font-size:13px;opacity:.85;animation:pulse 2.4s infinite}
@keyframes pulse{50%{opacity:.3}}

/* ---- home ---- */
.hgrid{position:absolute;top:70px;left:0;right:0;display:grid;grid-template-columns:repeat(4,60px);justify-content:space-between;padding:0 27px;row-gap:22px}
.app{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;width:60px;color:#fff;font-size:11px;cursor:pointer;text-shadow:0 1px 3px rgba(0,0,0,.35);white-space:nowrap}
.app:active .ico{filter:brightness(.7)}
.bounce .ico{animation:bounce .3s}
@keyframes bounce{40%{transform:scale(1.12)}}
.ico{width:60px;height:60px;border-radius:22.4%;overflow:hidden;position:relative;flex:none}
.ico svg{width:100%;height:100%;display:block}
.ico.cal{background:#fff;color:#000;display:flex;flex-direction:column;align-items:center;text-shadow:none}
.ico.cal i{font-style:normal;color:#ff3b30;font-size:10.5px;font-weight:500;margin-top:6px;line-height:1}
.ico.cal b{font-size:37px;font-weight:300;line-height:1.05;letter-spacing:-1px}
.badge-i{position:absolute;top:-7px;right:-7px;min-width:22px;height:22px;border-radius:11px;background:#ff3b30;color:#fff;font:600 14px/22px var(--font);text-align:center;padding:0 6px;text-shadow:none;z-index:2}
.dots{position:absolute;left:0;right:0;bottom:128px;display:flex;justify-content:center;gap:9px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4)}
.dots i.on{background:#fff}
.dock{position:absolute;left:8px;right:8px;bottom:12px;height:94px;border-radius:34px;background:rgba(255,255,255,.28);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);display:flex;justify-content:space-between;align-items:center;padding:0 19px}

/* ---- common app ---- */
.win{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column;overflow:hidden;color:#000;font-size:17px;z-index:5}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.sp44{height:44px;flex:none}
.blue{color:var(--blue)}
.tabbar{flex:none;display:flex;padding:7px 0 34px;background:rgba(249,249,249,.96);border-top:.5px solid rgba(0,0,0,.2)}
.tab{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:#929297;cursor:pointer}
.tab.on{color:var(--blue)}
.badge{position:absolute;top:-4px;left:calc(50% + 3px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#ff3b30;color:#fff;font:600 12px/18px var(--font);font-style:normal;text-align:center}
.large{font-size:34px;font-weight:700;padding:0 16px 8px;letter-spacing:.35px}
.srchbar{margin:0 16px 8px;height:36px;border-radius:10px;background:rgba(118,118,128,.12);display:flex;align-items:center;gap:6px;padding:0 8px;color:#8e8e93;font-size:17px}
.topbar{flex:none;display:flex;align-items:center;justify-content:space-between;height:44px;padding:0 16px}
.topbar>span{min-width:60px;font-size:17px;cursor:pointer}
.topbar>span:last-child{text-align:right}

/* 電話 */
.seg{display:flex;background:rgba(118,118,128,.12);border-radius:8.5px;padding:2px;width:170px}
.seg b{flex:1;text-align:center;font-size:13px;font-weight:500;padding:5px 0;border-radius:7px;cursor:pointer}
.seg b.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.crow{display:flex;align-items:center;padding:8px 16px 8px 32px;position:relative}
.crow::after{content:"";position:absolute;left:16px;right:16px;bottom:0;border-bottom:.5px solid var(--sep)}
.cmain{flex:1;min-width:0}.cn{font-size:17px;font-weight:600}.cn.red{color:#ff3b30}
.caret{display:inline-block;width:1.5px;height:16px;background:#2f8cff;vertical-align:-3px;margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ko{font-size:12px;color:#8e8e93;line-height:1.2;margin-top:1px}
.cs{font-size:14px;color:#8e8e93;display:flex;align-items:center;gap:4px}
.cw{font-size:15px;color:#8e8e93;margin-right:12px}
.info{width:22px;height:22px;border:1.5px solid var(--blue);border-radius:50%;color:var(--blue);font:600 14px/19px Georgia,serif;text-align:center;cursor:pointer;flex:none}
.ctr{padding:11px 16px;position:relative;cursor:pointer}
.ctr::after{content:"";position:absolute;left:16px;right:16px;bottom:0;border-bottom:.5px solid var(--sep)}
.myrow{padding:10px 16px 12px;border-bottom:.5px solid var(--sep)}
.myrow b{display:block;font-size:20px;font-weight:600}.myrow small{color:#8e8e93;font-size:13px}
.kp{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:4px;position:relative}
.kpnum{height:46px;font-size:34px;font-weight:300;display:flex;align-items:center;justify-content:center;margin-bottom:14px;letter-spacing:.5px;min-width:200px}
.keys{display:grid;grid-template-columns:repeat(3,75px);gap:14px 20px}
.key{width:75px;height:75px;border-radius:50%;background:#e8e8ec;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.key:active{background:#c8c8cd}
.key b{font-size:36px;font-weight:400;line-height:36px}
.key small{font-size:10px;letter-spacing:2px;font-weight:600;height:11px;line-height:11px}
.key.go{background:#34c759;color:#fff}.key.go:active{background:#2aa84a}
.key.ghost{background:none;color:#8e8e93}
.cav{width:90px;height:90px;border-radius:50%;margin:10px auto 8px;background:linear-gradient(#b9bec8,#8f95a1);color:#fff;font-size:42px;font-weight:500;display:flex;align-items:center;justify-content:center}
.cname{text-align:center;font-size:26px;font-weight:700;margin-bottom:14px}
.cact{display:flex;justify-content:center;gap:16px;padding:0 16px 16px;border-bottom:.5px solid var(--sep)}
.cact div{width:70px;text-align:center;font-size:11px;color:var(--blue)}
.cact i{display:flex;width:44px;height:44px;margin:0 auto 5px;border-radius:50%;background:rgba(0,122,255,.12);align-items:center;justify-content:center}
.cfield{padding:10px 16px;border-bottom:.5px solid var(--sep)}
.cfield small{display:block;font-size:13px;color:#8e8e93}
.empty{flex:1;display:flex;align-items:center;justify-content:center;color:#8e8e93;font-size:20px;font-weight:600;padding-bottom:60px}

/* 写真 */
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px}
.pt{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:32px;cursor:pointer;background-size:cover!important}
.pcount{text-align:center;color:#8e8e93;font-size:17px;padding:16px 0 20px}
.pv{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column;z-index:6}
.pvt{text-align:center;line-height:1.15}.pvt b{display:block;font-size:15px;font-weight:600}.pvt small{font-size:11px;color:#8e8e93}
.pvimg{flex:1;display:flex;align-items:center;justify-content:center;touch-action:pan-y;overflow:hidden}
.pvimg div{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:110px;background-size:contain!important;background-repeat:no-repeat!important;background-position:center!important}
.pvbar{flex:none;display:flex;justify-content:space-around;padding:10px 12px 34px;border-top:.5px solid rgba(0,0,0,.15);background:rgba(249,249,249,.96);color:var(--blue)}

/* Safari */
.saddr{flex:none;padding:6px 12px 8px}
.sbox2{height:36px;border-radius:10px;background:rgba(118,118,128,.12);display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:16px}
.sbox2 .aa{font-size:14px;color:#000;width:30px}
.surl{flex:1;text-align:center;display:flex;align-items:center;justify-content:center;gap:4px;font-size:16px;white-space:nowrap;overflow:hidden}
.surl.ph{color:#8e8e93}
.sbox2 .rl{width:30px;display:flex;justify-content:flex-end}
.stool{flex:none;display:flex;justify-content:space-around;align-items:center;padding:9px 0 34px;border-top:.5px solid rgba(0,0,0,.2);background:rgba(249,249,249,.96);color:var(--blue)}
.stool .off{color:#c4c4c9}
.stool>div{cursor:pointer;padding:0 14px}
.sh{padding:6px 16px 4px;font-size:22px;font-weight:700}
.favs{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 8px;padding:8px 16px 18px}
.fv{text-align:center;font-size:11px;cursor:pointer}
.fv i{display:flex;width:60px;height:60px;border-radius:14px;margin:0 auto 6px;align-items:center;justify-content:center;color:#fff;font:700 26px var(--font);font-style:normal}
.hrow{display:flex;gap:10px;align-items:center;padding:9px 16px;cursor:pointer;position:relative}
.hrow::after{content:"";position:absolute;left:16px;right:16px;bottom:0;border-bottom:.5px solid var(--sep)}
.hrow i{width:30px;height:30px;border-radius:7px;background:#e6e7ea;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:14px;color:#555;flex:none}
.hrow div{min-width:0}.hrow b{display:block;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow small{font-size:12px;color:#8e8e93}
.pgh{padding:48px 16px 18px;color:#fff;font-size:20px;font-weight:800;letter-spacing:1px;margin-top:-4px}
.pgb{padding:18px 20px 40px;font-family:var(--font)}
.pgb h1{font-size:23px;line-height:1.35;margin:0 0 12px}
.pgb p{font-size:15px;line-height:1.85;margin:0 0 14px;color:#333}
.pgb .meta{font-size:12px;color:#8e8e93;margin-bottom:14px}
.sq{padding:12px 16px;background:#f5f5f7}
.sq div{background:#fff;border:1px solid #ddd;border-radius:22px;padding:9px 16px;font-size:15px}
.res{margin-bottom:22px}.ru{font-size:12px;color:#188038}.rt{font-size:18px;color:#1a0dab;line-height:1.35;margin:2px 0}.rs{font-size:14px;color:#4d5156;line-height:1.55}
.sheet{position:absolute;inset:0;background:#f2f2f7;z-index:8;display:flex;flex-direction:column}

/* LIME */
.lime{--lm:#5cb200;background:#fff}
.lime .tab.on{color:var(--lm)}
.lhead{flex:none;display:flex;justify-content:space-between;align-items:center;padding:4px 16px 8px}
.lhead h2{margin:0;font-size:22px;font-weight:700}
.lic{display:flex;gap:18px;color:#3a3a3c}
.lsb{margin:0 16px 6px;height:34px;border-radius:17px;background:#f0f0f2;display:flex;align-items:center;gap:6px;padding:0 12px;color:#9a9aa0;font-size:14px}
.lmr{display:flex;gap:12px;align-items:center;padding:9px 16px;cursor:pointer}
.lmr:active{background:#f3f3f5}
.lav{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:21px;font-weight:700;flex:none}
.lav.s{width:36px;height:36px;font-size:16px}
.lmid{flex:1;min-width:0}.lnm{font-size:16px;font-weight:600}
.llast{font-size:13px;color:#8e8e93;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.lmeta{text-align:right;font-size:11px;color:#9a9aa0;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.ub{min-width:20px;height:20px;border-radius:10px;background:var(--lm);color:#fff;font:600 12px/20px var(--font);padding:0 6px;text-align:center}
.lsec{padding:10px 16px 4px;font-size:12px;color:#8e8e93;border-top:.5px solid #eee;margin-top:6px}
.chat{background:#8ea6c8}
.chead{flex:none;display:flex;align-items:center;gap:6px;padding:44px 12px 9px;background:#fff;border-bottom:.5px solid #ddd}
.chead .bk{display:flex;align-items:center;color:#333;cursor:pointer}
.chead .bk small{font-size:12px;background:#e8e8ea;border-radius:9px;padding:1px 6px;margin-left:2px}
.chead .nm0{flex:1;font-size:17px;font-weight:700;padding-left:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chead .ci{display:flex;gap:16px;color:#3a3a3c}
.cbody{flex:1;min-height:0;overflow-y:auto;padding:10px 10px 14px;display:flex;flex-direction:column;gap:6px;scrollbar-width:none}
.cbody::-webkit-scrollbar{display:none}
.dsep{align-self:center;background:rgba(0,0,0,.22);color:#fff;font-size:11px;padding:3px 12px;border-radius:12px;margin:8px 0}
.msg{display:flex;align-items:flex-end;gap:6px}
.msg.me{flex-direction:row-reverse}
.msg .gap{width:36px;flex:none}
.bub{max-width:62%;padding:9px 13px;border-radius:18px;background:#fff;font-size:15px;line-height:1.38;word-break:break-all;color:#000}
.me .bub{background:#8de055}
.pimg{width:58%;max-width:230px;border-radius:14px;display:block}
.stk{font-size:62px;line-height:1.05;padding:0 6px}
.mt{font-size:10px;color:rgba(255,255,255,.9);white-space:nowrap;line-height:1.25}
.me .mt{text-align:right}
.nmlab{font-size:12px;color:#fff;margin:2px 0 -2px 42px}
.cin{flex:none;display:flex;align-items:center;gap:13px;padding:8px 12px 34px;background:#fff;border-top:.5px solid #ddd;color:#555}
.cin>svg{flex:none}.cin .fld{min-width:0}
.cin .fld input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:14px;color:#111;height:100%}
.cin #csend{display:flex;width:26px;justify-content:center}.cin #csend.on{color:#fff;background:#06c755;border-radius:50%;height:26px;align-items:center;margin-right:-2px}
.cin .fld{flex:1;height:34px;border-radius:17px;background:#f0f0f2;color:#9a9aa0;font-size:14px;display:flex;align-items:center;justify-content:space-between;padding:0 12px}

/* メモ */
.notes{--ny:#d99a00;background:var(--bg2)}
.notes .acc{color:var(--ny)}
.ncard{margin:0 16px 14px;background:#fff;border-radius:11px;overflow:hidden}
.nr{display:flex;align-items:center;gap:12px;padding:11px 14px;position:relative;cursor:pointer}
.nr+.nr::before{content:"";position:absolute;left:14px;right:0;top:0;border-top:.5px solid var(--sep)}
.nr .fi{color:var(--ny);display:flex}
.nr .c{margin-left:auto;color:#8e8e93;display:flex;align-items:center;gap:6px}
.nsec{padding:6px 16px 6px;font-size:20px;font-weight:700}
.nrow{padding:9px 14px 10px;position:relative;cursor:pointer}
.nrow+.nrow::before{content:"";position:absolute;left:14px;right:0;top:0;border-top:.5px solid var(--sep)}
.nrow b{display:block;font-size:16px;font-weight:600}
.nrow small{font-size:13px;color:#8e8e93;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nrow small em{font-style:normal;color:#000;margin-right:8px}
.ntool{flex:none;display:flex;justify-content:space-around;align-items:center;padding:10px 24px 34px;background:rgba(249,249,249,.96);border-top:.5px solid rgba(0,0,0,.2);color:var(--ny);font-size:12px}
.ndoc{background:#fff}
.nd{padding:4px 18px 24px}

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const WD=["日","月","火","水","木","金","土"];
const pad=n=>String(n).padStart(2,"0");
const TODAY=(()=>{const d=CONFIG.phoneDate?new Date(CONFIG.phoneDate+"T00:00:00"):new Date();d.setHours(0,0,0,0);return d})();
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
window.TT={active:false,woke:false,running:false,sent:false};
const T0={start:Date.now()};
const nowHM=()=>{
  if(window.TT&&TT.active&&!TT.woke)return"15:00";
  if(!CONFIG.phoneTime){const d=new Date();return d.getHours()+":"+pad(d.getMinutes())}
  const [h,m]=CONFIG.phoneTime.split(":").map(Number);
  let run=CONFIG.clockRuns?Math.floor((Date.now()-T0.start)/60000):0;
  if(window.TT&&TT.active&&CONFIG.clockRuns){const el=Date.now()-T0.start;run=el<60000?Math.floor(el/12000):5+Math.floor((el-60000)/60000)}
  const t=h*60+m+run;
  return (Math.floor(t/60)%24)+":"+pad(t%60);
};

const phone=$(".phone"), screen=$("#screen"), appsEl=$("#apps"), homeEl=$("#home"), lockEl=$("#lock");

function swipe(el,h,th=36){
  let sx=0,sy=0,on=false;
  el.addEventListener("pointerdown",e=>{sx=e.clientX;sy=e.clientY;on=true});
  el.addEventListener("pointerup",e=>{
    if(!on)return;on=false;const dx=e.clientX-sx,dy=e.clientY-sy;
    if(Math.abs(dx)<8&&Math.abs(dy)<8){h.tap&&h.tap();return}
    if(Math.abs(dx)>Math.abs(dy)){if(dx<-th)h.left&&h.left();else if(dx>th)h.right&&h.right()}
    else{if(dy<-th)h.up&&h.up();else if(dy>th)h.down&&h.down()}
  });
  el.addEventListener("pointercancel",()=>{on=false});
}

/* ---- app open / close ---- */
const REAL={};
let current=null;
function openApp(id,tileEl){
  if(current)return;
  const fn=REAL[id];
  if(!fn){tileEl.classList.remove("bounce");void tileEl.offsetWidth;tileEl.classList.add("bounce");return}
  const win=document.createElement("div");
  win.className="win";appsEl.appendChild(win);
  current={id,win};
  fn(win);
  if(win.animate){
    const sr=screen.getBoundingClientRect(),tr=tileEl.getBoundingClientRect();
    const k=(sr.width/screen.offsetWidth)||1;
    win.style.transformOrigin=`${(tr.left+tr.width/2-sr.left)/k}px ${(tr.top+tr.height/2-sr.top)/k}px`;
    win.animate([{transform:"scale(.16)",opacity:0,borderRadius:"30px"},{transform:"scale(1)",opacity:1,borderRadius:"0px"}],{duration:340,easing:"cubic-bezier(.2,.8,.2,1)"});
  }
}
function closeApp(){
  if(!current)return;
  const {win}=current;current=null;setSB(false);
  if(win.animate){
    const a=win.animate([{transform:"scale(1)",opacity:1},{transform:"scale(.16)",opacity:0}],{duration:260,easing:"ease-in",fill:"forwards"});
    a.onfinish=()=>win.remove();
  }else win.remove();
}

const passEl=$("#pass");let pcIn="",pcBusy=false;
const PCKEYS=[["1",""],["2","ABC"],["3","DEF"],["4","GHI"],["5","JKL"],["6","MNO"],["7","PQRS"],["8","TUV"],["9","WXYZ"]];
function renderPass(shake){
  const n=CONFIG.passcode.length;
  passEl.innerHTML=`<div class="pc-t">パスコードを入力</div>
    <div class="pc-dots ${shake?"shake":""}">${Array.from({length:n},(_,i)=>`<i class="${i<pcIn.length?"on":""}"></i>`).join("")}</div>
    <div class="pc-keys">${PCKEYS.map(([k,s])=>`<div class="pk" data-k="${k}"><b>${k}</b><small>${s}</small></div>`).join("")}
    <div class="pk txt" data-a="em">緊急</div><div class="pk" data-k="0"><b>0</b><small></small></div><div class="pk txt" data-a="${pcIn?"del":"cancel"}">${pcIn?"削除":"キャンセル"}</div></div>`;
  $$("[data-k]",passEl).forEach(e=>e.onclick=()=>pcPress(e.dataset.k));
  $$("[data-a]",passEl).forEach(e=>e.onclick=()=>{
    if(e.dataset.a==="del")pcDel();else if(e.dataset.a==="cancel")hidePass();
  });
}
function showPass(){
  if(!CONFIG.passcode){unlock();return}
  if(passEl.classList.contains("in"))return;
  pcIn="";pcBusy=false;renderPass();lockEl.classList.add("dim");
  passEl.classList.add("show");requestAnimationFrame(()=>requestAnimationFrame(()=>passEl.classList.add("in")));
}
function hidePass(keepDim){passEl.classList.remove("in");if(keepDim!==true)lockEl.classList.remove("dim");setTimeout(()=>{if(!passEl.classList.contains("in"))passEl.classList.remove("show")},260)}
function pcDel(){if(pcBusy)return;pcIn=pcIn.slice(0,-1);renderPass()}
function pcPress(k){
  if(pcBusy||pcIn.length>=CONFIG.passcode.length)return;
  pcIn+=k;renderPass();
  if(pcIn.length===CONFIG.passcode.length){
    pcBusy=true;
    setTimeout(()=>{
      if(pcIn===CONFIG.passcode){hidePass(true);unlock()}
      else{renderPass(true);setTimeout(()=>{pcIn="";pcBusy=false;renderPass()},480)}
    },160);
  }
}
document.addEventListener("keydown",e=>{
  if(!passEl.classList.contains("in"))return;
  if(/^[0-9]$/.test(e.key))pcPress(e.key);
  else if(e.key==="Backspace")pcDel();
  else if(e.key==="Escape")hidePass();
});

function homeBarAction(){
  if(!lockEl.classList.contains("up")){passEl.classList.contains("in")?hidePass():showPass()}
  else closeApp();
}
(()=>{let st=null;const hb=$("#hbhit");hb.style.touchAction="none";

    const moved=Math.abs(dx)>8||Math.abs(dy)>8;
    if(!moved||dy<-24)homeBarAction();
  });
  addEventListener("pointercancel",()=>{st=null});
})();

REAL.voicememo=function(win){
  setSB(true);
  const RECS0=[
    {title:"191016",date:"2019/10/16",dur:100,
     lines:[[1.5, K("그러니까 잃어버리는 거야")], [5, K("뭐?")], [7.5, K("이렇게 된 건")], [10.5, K("네가 저지른 결과야")], [14, "..."], [16, "...!"], [18.5, K("시마")], [21.5, K(".. 시마..!")], [24.5, "..."], [27, K("... 기다려")], [30.5, K("주.. 죽...")], [34, K("죽이지 마...")], [37.5, K("죽이지 마..!")], [41, "..........."], [45, K("어떡할래?")], [48, K("최대의 찬스야")], [51.5, K("지금이라면 날")], [54, K("살인으로 체포할 수 있어")], [58, K("파트너 덕분이네~")], [62, "........"], [65, K("형사로 있을 것인지")], [69, K("쓰레기로 돌아갈 것인지")], [73, "...."], [76, K("뭐, 형사로 있고 싶다면...!")], [84, "...."], [87.5, K("시마....")], [91, K("파트너......")], [95, K("대답해........")]]},
  ];
  const RECS=RECS0.filter(r=>!(window.TT&&TT.active&&r.date>"2019/10/15"));
  const BARS=Array.from({length:70},(_,i)=>{const r=Math.sin(i*1.7)*.5+Math.sin(i*.63+2)*.35+.55;return Math.max(.12,Math.min(1,r))});
  let open=-1,playing=false,t=0,timer=null,last=0;
  const fmt=x=>Math.floor(x/60)+":"+pad(Math.floor(x%60));
  const bars=()=>BARS.map((h,i)=>`<i data-b="${i}" style="height:${Math.round(h*46)+4}px"></i>`).join("");
  const list=()=>`<div class="sp44"></div><div class="topbar"><span style="color:#ff3b30">編集</span><span></span><span></span></div>
    <div class="scroll"><div class="large">すべての録音</div>
    ${RECS.map((R,k)=>`<div class="vmrow" data-r="${k}"><div class="vmt"><b>${esc(R.title)}</b><span>${esc(R.date)}</span></div><div class="vmd">${fmt(R.dur)}</div></div>
    ${open===k?`<div class="vmx"><div class="vmwave">${bars()}</div><div class="vmtime"><span id="vme">0:00</span><span id="vmr">-${fmt(R.dur)}</span></div>
      <div class="vmctl"><span id="vmp">${playing?"❚❚":"▶"}</span></div>
      <div class="vmtr" id="vmtr"></div></div>`:""}`).join("")}
    </div><div class="vmrec"><div></div></div>`;
  function paint(){
    const e=$("#vme",win);if(!e||open<0)return;
    const R=RECS[open];
    e.textContent=fmt(t);$("#vmr",win).textContent="-"+fmt(Math.max(0,R.dur-t));
    const n=Math.round(t/R.dur*BARS.length);
    $$("[data-b]",win).forEach(b=>b.classList.toggle("pd",+b.dataset.b<n));
    const shown=R.lines.filter(l=>l[0]<=t),cur=shown[shown.length-1];
    $("#vmtr",win).innerHTML=cur?`<div class="cur">${esc([...cur[1]].slice(0,Math.max(1,Math.floor((t-cur[0])/0.14)+1)).join(""))}</div>`:"";
    $("#vmp",win).textContent=playing?"❚❚":"▶";
  }
  let waves=null;
  function startWaves(){
    if(waves)return;
    try{
      unlock();const c=vac,sr=c.sampleRate,N=Math.floor(sr*7),XF=Math.floor(sr*.8);
      const raw=new Float32Array(N+XF);let last=0;
      for(let i=0;i<raw.length;i++){const w=Math.random()*2-1;last=(last+.03*w)/1.03;raw[i]=last*9}
      const buf=c.createBuffer(1,N,sr),d=buf.getChannelData(0);
      for(let i=0;i<N;i++){d[i]=raw[i]}
      for(let i=0;i<XF;i++){const k=i/XF;d[i]=raw[i]*k+raw[N+i]*(1-k)}
      const mk=(freq,q)=>{const s0=c.createBufferSource();s0.buffer=buf;s0.loop=true;const f=c.createBiquadFilter();f.type="lowpass";f.frequency.value=freq;return [s0,f]};
      const master=c.createGain();master.gain.value=0;master.gain.linearRampToValueAtTime(1,c.currentTime+1.5);master.connect(c.destination);
      // 큰 파도(저음) : 약 9초 주기로 밀려왔다 빠짐
      const [s1,f1]=mk(600),g1=c.createGain();g1.gain.value=.16;
      const l1=c.createOscillator(),l1g=c.createGain(),l1f=c.createGain();l1.frequency.value=.11;l1g.gain.value=.12;l1f.gain.value=420;
      l1.connect(l1g);l1g.connect(g1.gain);l1.connect(l1f);l1f.connect(f1.frequency);
      s1.connect(f1);f1.connect(g1);g1.connect(master);
      // 거품(고음 쉬익) : 파도 마루에 맞춰 살짝
      const s2=c.createBufferSource();s2.buffer=buf;s2.loop=true;s2.playbackRate.value=1.7;
      const hp=c.createBiquadFilter();hp.type="highpass";hp.frequency.value=1800;const g2=c.createGain();g2.gain.value=.025;
      const l2=c.createOscillator(),l2g=c.createGain();l2.frequency.value=.11;l2g.gain.value=.022;l2.connect(l2g);l2g.connect(g2.gain);
      s2.connect(hp);hp.connect(g2);g2.connect(master);
      const t0=c.currentTime;s1.start(t0,Math.random()*3);s2.start(t0,Math.random()*3);l1.start(t0);l2.start(t0);
      waves={c,master,nodes:[s1,s2,l1,l2]};
    }catch(e){}
  }
  function stopWaves(){
    if(!waves)return;const w=waves;waves=null;
    try{const T=w.c.currentTime;w.master.gain.cancelScheduledValues(T);w.master.gain.setValueAtTime(w.master.gain.value,T);w.master.gain.linearRampToValueAtTime(0,T+.5);w.nodes.forEach(n=>{try{n.stop(T+.6)}catch(e){}})}catch(e){}
  }
  function stop(){playing=false;clearInterval(timer);timer=null;stopWaves()}
  let vac=null;
  function unlock(){
    try{
      vac=vac||new (window.AudioContext||window.webkitAudioContext)();
      if(vac.state!=="running")vac.resume();
      const b=vac.createBuffer(1,1,22050),s0=vac.createBufferSource();s0.buffer=b;s0.connect(vac.destination);s0.start(0);
    }catch(e){}
  }
  function gunshot(){
    try{
      unlock();
      const c=vac,sr=c.sampleRate,T=c.currentTime;
      const mk=(len,fn)=>{const b=c.createBuffer(1,Math.floor(sr*len),sr),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=fn(i/sr);return b};
      const out=c.createGain();out.gain.value=1;
      const sat=c.createWaveShaper();const cv=new Float32Array(1024);for(let i=0;i<1024;i++){const x=i/512-1;cv[i]=Math.tanh(x*3)}sat.curve=cv;
      const comp=c.createDynamicsCompressor();
      out.connect(sat);sat.connect(comp);comp.connect(c.destination);
      // 1) 날카로운 폭발음(크랙)
      const crack=c.createBufferSource();crack.buffer=mk(.08,x=>(Math.random()*2-1)*Math.exp(-x*160));
      const cg=c.createGain();cg.gain.value=1.4;crack.connect(cg);cg.connect(out);crack.start(T);
      // 2) 몸통(중음 노이즈)
      const body=c.createBufferSource();body.buffer=mk(.35,x=>(Math.random()*2-1)*Math.exp(-x*20));
      const lp=c.createBiquadFilter();lp.type="lowpass";lp.frequency.value=2600;
      const bg=c.createGain();bg.gain.value=.9;body.connect(lp);lp.connect(bg);bg.connect(out);body.start(T);
      // 3) 저음 쿵
      const o=c.createOscillator(),og=c.createGain();o.type="sine";
      o.frequency.setValueAtTime(130,T);o.frequency.exponentialRampToValueAtTime(40,T+.18);
      og.gain.setValueAtTime(1.1,T);og.gain.exponentialRampToValueAtTime(.001,T+.28);
      o.connect(og);og.connect(out);o.start(T);o.stop(T+.3);
      // 4) 실내 울림(짧은 잔향)
      const conv=c.createConvolver();conv.buffer=mk(1.3,x=>(Math.random()*2-1)*Math.exp(-x*4.2));
      const send=c.createGain();send.gain.value=.38;const rl=c.createBiquadFilter();rl.type="lowpass";rl.frequency.value=2200;
      crack.connect(send);body.connect(send);send.connect(rl);rl.connect(conv);conv.connect(comp);
    }catch(e){}
  }
  function tick(){
    if(!win.isConnected){stop();return}
    const R=RECS[open];
    const now=Date.now();const t0=t;t+=(now-last)/1000;last=now;
    if(R.shot!=null&&t0<R.shot&&t>=R.shot)gunshot();
    if(t>=R.dur){t=R.dur;stop();paint();return}
    paint();
  }
  function render(){
    win.innerHTML=list();
    $$(".vmrow",win).forEach(r=>r.onclick=()=>{const k=+r.dataset.r;stop();t=0;open=open===k?-1:k;render()});
    const p=$("#vmp",win);
    if(p)p.onclick=()=>{
      unlock();
      if(playing){stop();paint();return}
      if(t>=RECS[open].dur)t=0;
      playing=true;last=Date.now();timer=setInterval(tick,120);paint();
    };
    const wv=$(".vmwave",win);
    if(wv){
      const seek=ev=>{
        const r=wv.getBoundingClientRect(),sc=r.width/(wv.offsetWidth||r.width)||1;
        const f=Math.min(1,Math.max(0,(ev.clientX-r.left)/r.width));
        t=f*RECS[open].dur;last=Date.now();paint();
      };
      let drag=false;
      wv.addEventListener("pointerdown",ev=>{drag=true;try{wv.setPointerCapture(ev.pointerId)}catch(e){}seek(ev)});
      wv.addEventListener("pointermove",ev=>{if(drag)seek(ev)});
      const up=()=>{drag=false};
      wv.addEventListener("pointerup",up);wv.addEventListener("pointercancel",up);
    }
    if(open>=0)paint();
  }
  render();
};

/* ═══════════ Safari ═══════════ */
REAL.safari=function(win){
  setSB(true);
  const S=DATA.safari;let stack=[{type:"start"}],idx=0,sheet=false;
  if(window.__pendingPage){stack.push(window.__pendingPage);idx=1;window.__pendingPage=null}
  else if(S.history.find(h=>h.open)){stack.push(S.history.find(h=>h.open));idx=1}
  const cur=()=>stack[idx];
  const go=p=>{stack=stack.slice(0,idx+1);stack.push(p);idx++;sheet=false;render()};
  const startPage=()=>(!S.favorites.length&&!S.history.length)?`<div style="height:420px"></div>`:`<div class="sh">お気に入り</div><div class="favs">${S.favorites.map((f,i)=>`<div class="fv" data-f="${i}"><i style="background:${f.c}">${esc(f.ch)}</i>${esc(f.name)}</div>`).join("")}</div>
    <div class="sh">よく閲覧するサイト</div>${S.history.slice(0,4).map((h,i)=>`<div class="hrow" data-h="${i}"><i>${h.type==="search"?ic("search",15,2):esc((h.site||"W")[0])}</i><div><b>${esc(h.type==="search"?h.q:h.title)}</b><small>${esc(h.url)}</small></div></div>`).join("")}`;
  const pageHTML=p=>p.html?p.html:p.type==="search"
    ?`<div class="sq"><div>${esc(p.q)}</div></div><div class="pgb">${p.results.map(r=>`<div class="res"><div class="ru">${esc(r.url)}</div><div class="rt">${esc(r.title)}</div><div class="rs">${esc(r.snip)}</div></div>`).join("")}</div>`
    :`<div class="pgh" style="background:${p.color||"#333"}">${esc(p.site||p.url)}</div><div class="pgb"><h1>${esc(p.title)}</h1><div class="meta">${esc(p.meta||"")}</div>${p.body.map(t=>`<p>${esc(t)}</p>`).join("")}</div>`;
  const sheetHTML=()=>{
    let last="";
    return `<div class="sheet"><div class="sp44"></div><div class="topbar"><span></span><b style="font-size:17px">履歴</b><span class="blue done" style="font-weight:600">完了</span></div><div class="scroll" style="background:#fff">${S.history.length?"":`<div class="empty" style="padding-top:140px">履歴はありません</div>`}${S.history.map((h,i)=>{
      const head=h.when!==last?`<div class="sh" style="font-size:15px;color:#8e8e93;padding-top:12px;background:#f2f2f7">${esc(h.when)}</div>`:"";last=h.when;
      return head+`<div class="hrow" data-h="${i}"><i>${h.type==="search"?ic("search",15,2):esc((h.site||"W")[0])}</i><div><b>${esc(h.type==="search"?h.q:h.title)}</b><small>${esc(h.url)}</small></div></div>`}).join("")}</div></div>`;
  };
  function render(){
    const p=cur(),url=p.type==="start"?"":p.url;
    const can=[idx>0,idx<stack.length-1];
    win.innerHTML=`<div class="sp44"></div>
      <div class="saddr"><div class="sbox2"><span class="aa">ぁあ</span><span class="surl ${url?"":"ph"}">${url?ic("lock",11,2.2)+esc(url):"検索または Web サイト名を入力"}</span><span class="rl">${url?ic("reload",15,2):""}</span></div></div>
      <div class="scroll">${p.type==="start"?startPage():pageHTML(p)}</div>
      <div class="stool"><div data-a="b" class="${can[0]?"":"off"}">${ic("chevL",24,2.2)}</div><div data-a="f" class="${can[1]?"":"off"}">${ic("chevR",24,2.2)}</div><div>${ic("share",24,1.7)}</div><div data-a="h">${ic("book",24,1.7)}</div><div data-a="t">${ic("tabs",24,1.7)}</div></div>
      ${sheet?sheetHTML():""}`;
    $$("[data-f]",win).forEach(e=>e.onclick=()=>go(S.favorites[+e.dataset.f].page));
    $$("[data-h]",win).forEach(e=>e.onclick=()=>go(S.history[+e.dataset.h]));
    $$("[data-a]",win).forEach(e=>e.onclick=()=>{
      const a=e.dataset.a;
      if(a==="b"&&can[0]){idx--;render()}
      else if(a==="f"&&can[1]){idx++;render()}
      else if(a==="h"){sheet=true;render()}
      else if(a==="t"){stack=[{type:"start"}];idx=0;render()}
    });
    const dn=$(".done",win);if(dn)dn.onclick=()=>{sheet=false;render()};
  }
  render();
};

  const hm=()=>nowHM().replace(/^(\d):/,"0$1:");
  const REPLY={
    "母":[K("카즈미? 맞으면 제발 대답 좀 해봐..."),K("카즈미... 엄마야. 한마디만 해주렴"),K("엄마는 네가 살아있다고 믿는다")],

    "志摩 和也":[K("카즈미? 맞으면 제발 대답 좀 해봐..."),K("카즈미 나야. 답 좀 해줘"),K("무서워... 아무 말이나 해줘")],

    "志摩 大和":[K("카즈미? 맞으면 제발 대답 좀 해줘..."),K("카즈미 진짜 카즈미 맞지?"),K("제발... 아무 말이라도 해줘")],
    "桔梗 ゆずる":[K("시마? 정말 시마 맞아?"),K("답장할 수 있는 상황이야?"),K("시마. 읽었으면 한 글자라도 보내"),K("꼭 찾을게. 그러니까 답해줘")],
  };
  const PROF=/씨발|시발|ㅅㅂ|ㅆㅂ|병신|ㅂㅅ|새끼|개새|꺼져|닥쳐|지랄|미친|좆|ㅈ같|존나|염병|엿먹|fuck|shit|bitch|죽어|죽고\s*싶|죽을래|죽인다|죽여|뒤질|뒈져|뒤져|꺼지|씹|ㅗ|死ね|死にたい|殺す|ぶっ殺|くたばれ|クソ|くそ|ふざけ|うざ|バカ|ばか|てめえ|野郎|消えろ|去死|杀了|宰了|混蛋|他妈|妈的|操你|滚|傻[逼B比]|王八蛋|疯子|垃圾/i;
  const ANGRY=[K("살아있으면 얌전하게 감빵에나 갈 것이지"),K("뭐? 이 새끼가 지금 누구한테 죽으래"),K("살인자 주제에 입은 살아가지고"),K("경찰이 협박하냐? 이 미친놈아 신고한다"),K("야 이부키 너 진짜 눈깔 돌았냐"),K("사람 죽여놓고 어디서 큰소리야"),K("너 잡히면 가만 안 둔다"),K("하 이 새끼 진짜 안 변했네 쌈박질밖에 모르는 게")];
  const lines=c=>c.stranger?ANGRY:(REPLY[c.name]||[]);
  const fresh=c=>lines(c).filter(l=>!c.msgs.some(m=>m.t===l));
  function sendMsg(txt){
    const c=L.chats[chat];if(!c||c.draft||!txt.trim())return;
    const day="20/06/26",last=[...c.msgs].reverse().find(m=>m.sep);
    if(!last||last.sep!==day)c.msgs.push({sep:day});
    c.msgs.push({from:"me",t:txt.trim(),time:hm(),read:true});

        const SEQ=[K("이부키"),K("미안해"),K("널 위험에 빠뜨렸네"),K("날 용서하지 마")];
        const push=i=>{
          if(i>=SEQ.length)return;

        c.msgs.push({from:"them",t:line,time:hm()});c._t=Date.now();c.time=day;
        if(chat!==null&&L.chats[chat]===c){const v=$("#cmsg",win),val=v?v.value:"";render();const v2=$("#cmsg",win);if(v2){v2.value=val;v2.focus()}}
        else{c.unread=(c.unread||0)+1;refreshLimeBadge();if(chat===null)render()}
      },5500+Math.random()*4000);
    }
    render();const v=$("#cmsg",win);if(v)v.focus();

  function render(){

    win.innerHTML=t+tabbar()+(chat!==null?chatView():"");

          if(!document.body.contains(win)||L.chats[chat]!==c||chat===null)return;
          const F=fresh(c);if(!F.length)return;
          const line=F[Math.floor(Math.random()*F.length)],day="20/06/26",last=[...c.msgs].reverse().find(m=>m.sep);
          if(!last||last.sep!==day)c.msgs.push({sep:day});
          c.msgs.push({from:"them",t:line,time:hm()});c._t=Date.now();c.time=day;
          const v=$("#cmsg",win),val=v?v.value:"";render();const v2=$("#cmsg",win);if(v2){v2.value=val;if(val)v2.dispatchEvent(new Event("input"))}
        },2500+Math.random()*3500);
      }
    });
    const bk=$(".chead .bk",win);if(bk)bk.onclick=()=>{chat=null;render()};
    const cb=$("#cb",win);if(cb)cb.scrollTop=cb.scrollHeight;
    const inp=$("#cmsg",win),sb=$("#csend",win);
    if(inp&&sb){
      const upd=()=>{const on=!!inp.value.trim();sb.classList.toggle("on",on);sb.innerHTML=ic(on?"send":"mic",on?20:23,on?2.4:1.8)};
      inp.addEventListener("input",upd);
      inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();const v=inp.value;inp.value="";sendMsg(v)}});
      sb.onclick=()=>{if(inp.value.trim()){const v=inp.value;inp.value="";sendMsg(v)}};
    }
    if(chat!==null)setSB(true);
  }
  win._render=render;
  render();
};

REAL.calendar=function(win){
  setSB(true);win.classList.add("cal-w");
  const Y_MIN=2010,Y_MAX=2032;
  let y=TODAY.getFullYear(),m=TODAY.getMonth(),sel=new Date(TODAY),mode="month";
  /* 予定: date 指定 / yearly:"MM-DD" で毎年(fromYear 以降) */
  const evOf=k=>DATA.events.filter(e=>e.date===k||(e.yearly&&k.slice(5)===e.yearly&&(!e.fromYear||+k.slice(0,4)>=e.fromYear)))
    .sort((a,b)=>(a.allDay?"":a.start||"").localeCompare(b.allDay?"":b.start||""));
  const shift=d=>{m+=d;if(m<0){m=11;y--}if(m>11){m=0;y++}if(y<Y_MIN){y=Y_MIN;m=0}if(y>Y_MAX){y=Y_MAX;m=11}render()};
  const red="#ff3b30";
  const tbIcons=`<span style="display:flex;gap:20px;justify-content:flex-end;color:${red}">${ic("search",22,1.9)}${ic("plus",24,1.9)}</span>`;
  const tool=`<div class="ctool"><span id="td" style="color:${red}">今日</span><span style="color:${red}">カレンダー</span><span style="color:${red}">受信</span></div>`;

  function miniMonth(yy,mm){
    const start=new Date(yy,mm,1).getDay(),days=new Date(yy,mm+1,0).getDate();
    const isCurM=yy===TODAY.getFullYear()&&mm===TODAY.getMonth();
    let c="";
    for(let i=0;i<start;i++)c+="<span></span>";
    for(let d=1;d<=days;d++)c+=`<span class="${isCurM&&d===TODAY.getDate()?"t":""}">${d}</span>`;
    return `<div class="mm" data-y="${yy}" data-m="${mm}"><div class="mmt ${isCurM?"cur":""}">${mm+1}月</div><div class="mmg">${c}</div></div>`;
  }
  function yearView(){
    let h="";
    for(let yy=Y_MIN;yy<=Y_MAX;yy++){
      h+=`<div class="yr" id="yr${yy}"><div class="ytl ${yy===TODAY.getFullYear()?"cur":""}">${yy}年</div><div class="ymg">${Array.from({length:12},(_,i)=>miniMonth(yy,i)).join("")}</div></div>`;
    }
    win.innerHTML=`<div class="sp44"></div><div class="topbar"><span></span>${tbIcons}</div><div class="scroll" id="ys" style="position:relative">${h}</div>${tool}`;
    const ys=$("#ys",win),goto=yy=>{const el=$("#yr"+yy,win);if(el)ys.scrollTop=el.offsetTop-2};
    goto(y);
    $$(".mm",win).forEach(e=>e.onclick=()=>{
      y=+e.dataset.y;m=+e.dataset.m;
      sel=(y===TODAY.getFullYear()&&m===TODAY.getMonth())?new Date(TODAY):new Date(y,m,1);
      mode="month";render();
    });
    $("#td",win).onclick=()=>{y=TODAY.getFullYear();goto(y)};
  }
  function monthView(){
    const first=new Date(y,m,1),start=first.getDay(),days=new Date(y,m+1,0).getDate(),weeks=Math.ceil((start+days)/7);
    let cells="";
    for(let i=0;i<weeks*7;i++){
      const d=new Date(y,m,1-start+i),k=ymd(d),out=d.getMonth()!==m;
      const cls=["cd",out?"out":"",k===ymd(TODAY)?"today":"",k===ymd(sel)?"sel":"",d.getDay()===0?"sun":"",d.getDay()===6?"sat":""].join(" ");
      cells+=`<div class="${cls}" data-d="${k}"><span>${d.getDate()}</span>${evOf(k).length?`<i class="dot"></i>`:""}</div>`;
    }
    const evs=evOf(ymd(sel));
    win.innerHTML=`<div class="sp44"></div>
      <div class="topbar"><span id="yb" style="display:flex;align-items:center;gap:2px;color:${red};cursor:pointer">${ic("chevL",18,2.4)}${y}年</span>${tbIcons}</div>
      <div class="cmo">${m+1}月</div>
      <div class="cwd">${WD.map((w,i)=>`<span style="${i===0?"color:#e0453a":i===6?"color:#2d6fd8":""}">${w}</span>`).join("")}</div>
      <div class="cgrid" id="cg">${cells}</div>
      <div class="evh">${sel.getFullYear()}年${sel.getMonth()+1}月${sel.getDate()}日 ${WD[sel.getDay()]}曜日</div>
      <div class="scroll">${evs.length?evs.map(e=>`<div class="ev"><div class="tm">${e.allDay?"終日":`${esc(e.start)}${e.end?`<small>${esc(e.end)}</small>`:""}`}</div><div class="bar" style="background:${e.color||"#ff9500"}"></div><div class="tx"><b>${esc(e.title)}</b>${e.place?`<small>${esc(e.place)}</small>`:""}</div></div>`).join(""):`<div class="noev">予定なし</div>`}</div>
      ${tool}`;
    $$(".cd",win).forEach(c=>c.onclick=()=>{const [yy,mm,dd]=c.dataset.d.split("-").map(Number);sel=new Date(yy,mm-1,dd);if(mm-1!==m||yy!==y){y=yy;m=mm-1}render();if(c.dataset.d==="2019-10-15"&&window.startTT&&!TT.active)startTT()});
    $("#yb",win).onclick=()=>{mode="year";render()};
    $("#td",win).onclick=()=>{y=TODAY.getFullYear();m=TODAY.getMonth();sel=new Date(TODAY);render()};
    const g=$("#cg",win);
    swipe(g,{up:()=>shift(1),down:()=>shift(-1),left:()=>shift(1),right:()=>shift(-1)});
    g.addEventListener("wheel",e=>{e.preventDefault();if(g._w)return;g._w=1;setTimeout(()=>g._w=0,350);shift(e.deltaY>0?1:-1)},{passive:false});
  }
  function render(){mode==="year"?yearView():monthView()}
  render();
};

(function(){
  const S=window.SND={vol:3,max:4,silent:false};
  const scr=$("#screen");
  const sleep=document.createElement("div");sleep.id="sleep";scr.appendChild(sleep);
  const vh=document.createElement("div");vh.className="vhud";vh.innerHTML="<i></i>";scr.appendChild(vh);
  const sh=document.createElement("div");sh.className="shud";scr.appendChild(sh);
  let vt=null,st=null;
  const showVol=()=>{$("i",vh).style.height=(S.silent?0:S.vol/S.max*100)+"%";vh.classList.add("show");clearTimeout(vt);vt=setTimeout(()=>vh.classList.remove("show"),1500)};
  const showSil=()=>{sh.textContent=S.silent?"🔕 消音モード：オン":"🔔 消音モード：オフ";sh.classList.add("show");clearTimeout(st);st=setTimeout(()=>sh.classList.remove("show"),1800)};
  let off=false;
  function power(){
    if(!off){
      off=true;
      $$(".incall,.msgban").forEach(e=>e.classList.remove("show"));
      sleep.classList.add("on");
      // スリープ中は自動でロック
      setTimeout(()=>{
        if(typeof hidePass==="function")hidePass();
        lockEl.classList.remove("up");lockEl.style.display="";lockEl.classList.remove("dim");
        buildLock();
      },360);
    }else{
      off=false;sleep.classList.remove("on");
      if(window.onWake)onWake();
    }
  }
  window.powerOff=()=>{if(!off)power()};
  window.wakePhone=()=>{if(off)power()};
  $$(".sbtn[data-btn]").forEach(b=>b.addEventListener("click",()=>{
    const k=b.dataset.btn;
    if(k==="power"){power();return}
    if(off)return;
    if(k==="switch"){S.silent=!S.silent;showSil();return}
    if(k==="up"){S.silent=false;S.vol=Math.min(S.max,S.vol+1);showVol();return}
    if(k==="down"){S.vol=Math.max(0,S.vol-1);showVol();if(S.vol===0){S.silent=true;showSil()}}
  }));
  sleep.addEventListener("click",()=>{if(off)power()});
})();

  window.startTT=function(){

    scr.appendChild(ov);

    const timers=[];let dead=false;
    requestAnimationFrame(()=>requestAnimationFrame(()=>ov.classList.add("show")));
    let li=0;
    const typeLine=()=>{
      if(dead)return;
      if(li>=LINES.length){timers.push(setTimeout(()=>ttc.classList.add("show"),500));return}
      const txt=[...LINES[li++]];let k=0;ttl.textContent="";
      const tt=setInterval(()=>{
        if(dead){clearInterval(tt);return}
        ttl.textContent+=txt[k++];
        if(k>=txt.length){clearInterval(tt);timers.push(setTimeout(typeLine,li>=LINES.length?200:1300))}
      },95);
      timers.push(tt);
    };
    timers.push(setTimeout(typeLine,1600));

    $('[data-a=n]',ov).onclick=close;

      const t0=new Date(2020,5,26,16,4).getTime(),t1=new Date(2019,9,15,15,0).getTime();
      const T=5200,st=Date.now();
      let ac=null,lastTick=0,tock=false;
      const tickSnd=()=>{
        try{
          const S=window.SND||{vol:3,silent:false};if(S.silent||!S.vol)return;
          ac=ac||new (window.AudioContext||window.webkitAudioContext)();
          const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
          o.type="square";o.frequency.value=tock?1500:2100;tock=!tock;
          g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.06*S.vol/4,t+.002);g.gain.exponentialRampToValueAtTime(.0001,t+.03);
          o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.04);
        }catch(e){}
      };
      timers.push(setTimeout(()=>{ttk.classList.add("show")},700));
      const iv=setInterval(()=>{
        const p=Math.min(1,(Date.now()-st-900)/T);
        if(p<0){return}
        const e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
        const now=Date.now(),gap=1000/(5+17*Math.sin(Math.PI*Math.min(1,p)));
        if(p<1&&now-lastTick>=gap){lastTick=now;tickSnd()}
        ttk.textContent=fmt(t0-(t0-t1)*e);
        if(p>=1){
          clearInterval(iv);
          ttk.textContent=fmt(t1);
          timers.push(setTimeout(()=>{
            rewindWorld();
            if(window.powerOff)powerOff();
            setTimeout(()=>{ov.remove();TT.running=false},700);
          },1100));
        }
      },40);
      timers.push(iv);
    };
  };

  },2000);
})();
